<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
            <div class="page-loader">
                <div class="loader-content">
                    <img src="images/logo.svg" alt="logo" class="loader-logo">
                    <span>Loading...</span>
                </div>
            </div>
            
            <div class="page-content">
                <div class="wrapper">
                    <div class="box">
                        <a href="index.html" class="close-btn">
                            ×
                        </a>
            
                        <div class="switcher">
                            <span>Login</span>
                            <span class="divider">|</span>
                            <span class="active">Register</span>
                        </div>
            
                        <p class="subtitle">
                            Enter your email and password to register.
                        </p>
            
                        <form class="form">
                            <input type="text" placeholder="Username">
                            <input type="email" placeholder="Enter your email address">
            
                            <div class="password-field">
                                <input type="password" placeholder="Password">
                                <img src="images/hide.png" alt="">
                            </div>
            
                            <input type="password" placeholder="Confirm Password">
                            <button class="register-submit">
                                Register
                            </button>
                        </form>
            
                        <p class="divider">Or register with</p>
                        <div class="social-auth">
                            <button class="social-btn">
                                <img src="images/google.svg" alt="">
                                Continue with Google
                            </button>
            
                            <button class="social-btn">
                                <img src="images/facebook.svg" alt="">
                                Continue with Facebook
                            </button>
                        </div>
                    </div>
                </div>
            </div>
</body>
</html>
